 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Collection | Velvet Touch Studio</title>

    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/collection.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <a href="index.html">
        <img src="Assets/logo-velvet.png"
            class="nav-logo">
    </a>

    <div class="nav-icons">

        <a href="https://www.instagram.com/velvet_touch_studio07/"
            target="_blank">

            <img src="Assets/instagram.png"
                class="social-icon">

        </a>

    </div>

</header>


<!-- ================= HERO ================= -->

<section class="collection-hero">

    <div class="overlay"></div>

    <div class="hero-content">

        <a href="index.html" class="back-link">
            ← Back Home
        </a>

        <span id="collectionTag">
            Collection
        </span>

        <h1 id="collectionTitle">
            Flowers
        </h1>

        <p id="collectionDescription">

            Handmade crochet creations made
            with love and care.

        </p>

    </div>

</section>


<!-- ================= PRODUCTS ================= -->

<section class="collection-products">

    <div class="product-count">

        <span id="totalProducts">
            0 Products
        </span>

    </div>

    <div class="product-grid"
        id="productGrid">

    </div>

</section>


<!-- ================= CTA ================= -->

<section class="custom-order">

    <h2>

        Looking for something unique?

    </h2>

    <p>

        Share your inspiration with us and
        we'll crochet something made
        especially for you.

    </p>

    <a

href="https://wa.me/919152368605?text=Hi! I'd like to place a custom crochet order."

class="order-btn"

target="_blank">

Start a Custom Order

</a>

</section>


<!-- ================= FOOTER ================= -->

<footer>

    Same Footer

</footer>


<script src="JS/collection.js"></script>

</body>

</html>
